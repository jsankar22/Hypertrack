<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HYPERTRACK{% endblock %}</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0f0f1a',
                            accent: '#3b82f6',
                            accentHover: '#2563eb',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col md:flex-row">

    {% if user.is_authenticated %}
    <!-- DESKTOP SIDEBAR -->
    <aside class="hidden md:flex flex-col w-64 bg-brand-dark text-white min-h-screen flex-shrink-0 border-r border-gray-800">
        <!-- Logo / Brand Header -->
        <div class="h-20 flex items-center px-6 border-b border-gray-800">
            <span class="text-xl font-extrabold tracking-wider">
            <span class="text-blue-400">Hyper</span><span class="text-white">Track</span>
            </span>
        </div>
        
        <!-- Navigation Menu -->
        <nav class="flex-1 px-4 py-6 space-y-1">
            <!-- Dashboard Link -->
            <a href="{% url 'dashboard' %}" class="flex items-center px-4 py-3 rounded-xl transition-all duration-150 group {% if active_tab == 'dashboard' %}bg-blue-600/15 text-blue-400 font-medium{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                Dashboard
            </a>
            
            <!-- Workouts Link -->
            <a href="{% url 'workout_list' %}" class="flex items-center px-4 py-3 rounded-xl transition-all duration-150 group {% if active_tab == 'workouts' %}bg-blue-600/15 text-blue-400 font-medium{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/>
                </svg>
                Workouts
            </a>
            
            <!-- Nutrition Link -->
            <a href="{% url 'nutrition_daily' %}" class="flex items-center px-4 py-3 rounded-xl transition-all duration-150 group {% if active_tab == 'nutrition' %}bg-blue-600/15 text-blue-400 font-medium{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18m9-9H3"/>
                </svg>
                Nutrition
            </a>
            
            <!-- Coach Link -->
            <a href="{% url 'chatbot' %}" class="flex items-center px-4 py-3 rounded-xl transition-all duration-150 group {% if active_tab == 'chatbot' %}bg-blue-600/15 text-blue-400 font-medium{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
                </svg>
                Coach
            </a>
            
            <!-- Profile Link -->
            <a href="{% url 'profile' %}" class="flex items-center px-4 py-3 rounded-xl transition-all duration-150 group {% if active_tab == 'profile' %}bg-blue-600/15 text-blue-400 font-medium{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                Profile
            </a>
        </nav>
        
        <!-- User Info / Logout Button -->
        <div class="p-4 border-t border-gray-800 flex flex-col gap-3">
            <div class="px-4 py-2">
                <p class="text-sm font-semibold truncate">{{ user.name|default:user.email }}</p>
                <p class="text-xs text-gray-500 truncate">{{ user.email }}</p>
            </div>
            <a href="{% url 'logout' %}" class="flex items-center px-4 py-2.5 text-sm font-medium text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-xl transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
                Logout
            </a>
        </div>
    </aside>

    <!-- MOBILE NAVIGATION (BOTTOM BAR) -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-brand-dark text-white border-t border-gray-800 z-50 flex justify-around items-center h-16 px-2">
        <a href="{% url 'dashboard' %}" class="flex flex-col items-center justify-center w-14 py-1 transition-all {% if active_tab == 'dashboard' %}text-blue-400{% else %}text-gray-500 hover:text-gray-300{% endif %}">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            <span class="text-[10px] mt-0.5">Dashboard</span>
        </a>
        <a href="{% url 'workout_list' %}" class="flex flex-col items-center justify-center w-14 py-1 transition-all {% if active_tab == 'workouts' %}text-blue-400{% else %}text-gray-500 hover:text-gray-300{% endif %}">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/>
            </svg>
            <span class="text-[10px] mt-0.5">Workouts</span>
        </a>
        <a href="{% url 'nutrition_daily' %}" class="flex flex-col items-center justify-center w-14 py-1 transition-all {% if active_tab == 'nutrition' %}text-blue-400{% else %}text-gray-500 hover:text-gray-300{% endif %}">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18m9-9H3"/>
            </svg>
            <span class="text-[10px] mt-0.5">Nutrition</span>
        </a>
        <a href="{% url 'chatbot' %}" class="flex flex-col items-center justify-center w-14 py-1 transition-all {% if active_tab == 'chatbot' %}text-blue-400{% else %}text-gray-500 hover:text-gray-300{% endif %}">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
            </svg>
            <span class="text-[10px] mt-0.5">Coach</span>
        </a>
        <a href="{% url 'profile' %}" class="flex flex-col items-center justify-center w-14 py-1 transition-all {% if active_tab == 'profile' %}text-blue-400{% else %}text-gray-500 hover:text-gray-300{% endif %}">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <span class="text-[10px] mt-0.5">Profile</span>
        </a>
        <a href="{% url 'logout' %}" class="flex flex-col items-center justify-center w-14 py-1 text-red-400 hover:text-red-300">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            <span class="text-[10px] mt-0.5">Logout</span>
        </a>
    </nav>
    {% endif %}

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-1 min-h-screen {% if user.is_authenticated %}pb-20 md:pb-0{% endif %}">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
